<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workday Autofill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <header>
      <button id="autofillBtn" class="autofill-btn">AUTOFILL ACTIVE PAGE</button>
      <h1>Profile Settings</h1>
    </header>

    <form id="profileForm">
      <!-- Personal Information -->
      <section>
        <h2>Personal Information</h2>
        <div class="input-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" placeholder="Jane" />
        </div>
        <div class="input-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" placeholder="Doe" />
        </div>
        <div class="input-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" placeholder="+1 (555) 000-0000" />
        </div>
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="jane@example.com" />
        </div>
        <div class="input-group">
          <label for="linkedinUrl">LinkedIn URL</label>
          <input type="url" id="linkedinUrl" placeholder="https://linkedin.com/in/..." />
        </div>
      </section>

      <!-- Address -->
      <section>
        <h2>Address</h2>
        <div class="input-group">
          <label for="street">Street Address</label>
          <input type="text" id="street" placeholder="123 Main St" />
        </div>
        <div class="input-group">
          <label for="city">City</label>
          <input type="text" id="city" placeholder="New York" />
        </div>
        <div class="input-group">
          <label for="state">State (Full Name)</label>
          <input type="text" id="state" placeholder="New York" />
        </div>
        <div class="input-group">
          <label for="zip">Zip / Postal Code</label>
          <input type="text" id="zip" placeholder="10001" />
        </div>
        <div class="input-group">
          <label for="country">Country</label>
          <input type="text" id="country" placeholder="United States of America" />
        </div>
      </section>

      <!-- Education -->
      <section>
        <h2>Education</h2>
        <div id="education-container"></div>
        <button type="button" id="addEduBtn" class="add-btn">+ Add Education</button>
      </section>

      <!-- Work Experience -->
      <section>
        <h2>Work Experience</h2>
        <div id="work-container"></div>
        <button type="button" id="addWorkBtn" class="add-btn">+ Add Work Experience</button>
      </section>

      <!-- Skills -->
      <section>
        <h2>Skills</h2>
        <p class="helper">Comma separated (e.g. Java, Python, React)</p>
        <textarea id="skills" rows="3" placeholder="Java, Python, Project Management"></textarea>
      </section>

      <!-- Resume -->
      <section>
        <h2>Resume</h2>
        <p class="helper">Upload PDF or DOCX (Max 2MB)</p>
        <input type="file" id="resume" accept=".pdf,.doc,.docx" />
        <div id="resumeStatus" class="helper" style="margin-top:4px; color: var(--primary);"></div>
      </section>

      <div class="sticky-footer">
        <button type="button" id="deleteBtn"
          style="background-color: transparent; border: 1px solid #ef4444; color: #ef4444; margin-bottom: 8px;">Delete
          All Data</button>
        <button type="submit" id="saveBtn">Save Profile</button>
        <div id="status" class="status"></div>
      </div>
    </form>
  </div>

  <!-- Templates -->
  <template id="education-template">
    <div class="card edu-card">
      <div class="card-header">
        <span>Education Entry</span>
        <button type="button" class="remove-btn">Remove</button>
      </div>
      <div class="input-group">
        <label>School</label>
        <input type="text" class="edu-school" placeholder="University of Tech" />
      </div>
      <div class="input-group">
        <label>Degree</label>
        <input type="text" class="edu-degree" placeholder="Bachelor of Science" />
      </div>
      <div class="input-group">
        <label>Field of Study</label>
        <input type="text" class="edu-field" placeholder="Computer Science" />
      </div>
      <div class="input-group">
        <label>GPA</label>
        <input type="text" class="edu-gpa" placeholder="3.5" />
      </div>
      <div class="row">
        <div class="input-group half">
          <label>Start Month</label>
          <input type="text" class="edu-start-month" placeholder="09" />
        </div>
        <div class="input-group half">
          <label>Start Year</label>
          <input type="text" class="edu-start-year" placeholder="2018" />
        </div>
      </div>
      <div class="row">
        <div class="input-group half">
          <label>End Month</label>
          <input type="text" class="edu-end-month" placeholder="05" />
        </div>
        <div class="input-group half">
          <label>End Year</label>
          <input type="text" class="edu-end-year" placeholder="2022" />
        </div>
      </div>
    </div>
  </template>

  <template id="work-template">
    <div class="card work-card">
      <div class="card-header">
        <span>Work Entry</span>
        <button type="button" class="remove-btn">Remove</button>
      </div>
      <div class="input-group">
        <label>Company</label>
        <input type="text" class="work-company" placeholder="Tech Corp" />
      </div>
      <div class="input-group">
        <label>Job Title</label>
        <input type="text" class="work-title" placeholder="Software Engineer" />
      </div>
      <div class="input-group">
        <label>Location</label>
        <input type="text" class="work-location" placeholder="New York, NY" />
      </div>
      <div class="input-group">
        <label>Role Description</label>
        <textarea class="work-desc" rows="3" placeholder="Developed web apps..."></textarea>
      </div>
      <div class="row">
        <div class="input-group half">
          <label>Start Month</label>
          <input type="text" class="work-start-month" placeholder="01" />
        </div>
        <div class="input-group half">
          <label>Start Year</label>
          <input type="text" class="work-start-year" placeholder="2020" />
        </div>
      </div>
      <div class="row">
        <div class="input-group half">
          <label>End Month</label>
          <input type="text" class="work-end-month" placeholder="Present" />
        </div>
        <div class="input-group half">
          <label>End Year</label>
          <input type="text" class="work-end-year" placeholder="Present" />
        </div>
      </div>
      <div class="input-group checkbox-group">
        <input type="checkbox" class="work-current" />
        <label>I currently work here</label>
      </div>
    </div>
  </template>

  <script src="popup.js"></script>
</body>

</html>
